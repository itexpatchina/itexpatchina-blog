name: Sync Public Repos to Blog Posts

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repos.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --staged --quiet; then
            echo "No new changes from public repositories."
          else
            git commit -m "chore: auto-sync public repos to blog posts"
            git push
          fi
