baseURL = 'https://www.itexpatchina.com/'
languageCode = 'en-us'
title = 'IT Expat China'
theme = 'PaperMod'

[params]
  description = "Tech Knowledge Share From Behind the GFW | 翻墙与 Homelab 技术分享"
  defaultTheme = "auto" # Options: "dark", "light", "auto"
  showThemeToggle = true

  # Header & Footer Navigation
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Clean homepage layout with bilingual welcome banner
  [params.homeInfoParams]
    Title = "👋 Welcome to IT Expat China | 欢迎来到 IT Expat China"
    Content = "Sharing practical guides on homelabs, VPS networking, proxy setups, and tech workarounds from behind the GFW.<br><br>分享关于家庭实验室、VPS 网络、代理框架与 GFW 实用技术的实战指南。"

  # Social links displayed on homepage
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/itexpatchina"

  # Custom Header for Google AdSense
  customHeader = '''
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000"
          crossorigin="anonymous"></script>
  '''

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "omnitools"
    name = "OmniTools"
    url = "https://omni.itexpatchina.com/"
    weight = 15

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
